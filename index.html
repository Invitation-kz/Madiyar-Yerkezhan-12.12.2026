        <style>
            * {

        <script>
            document.addEventListener("DOMContentLoaded", function () {
                const modal = document.getElementById("musicModal");
                const playBtn = document.getElementById("playMusic");
                const audio = document.getElementById("backgroundMusic");

                function openInvitation() {
                    audio.play().catch(function (err) {
                        console.warn("Не удалось запустить музыку:", err);
                    });

                    // Закрываем модальное окно и разблокируем прокрутку
                    modal.style.display = "none";
                    document.body.classList.remove("modal-open");

                    document.querySelectorAll(".element-animation").forEach(function (el) {
                        el.classList.add("element-show");
                    });
                }

                playBtn.addEventListener("click", openInvitation);

                // Фотолардың бірте-бірте пайда болуы
                const observer = new IntersectionObserver(
                    function (entries) {
                        entries.forEach(function (entry) {
                            if (entry.isIntersecting) {
                                entry.target.classList.add("element-show");
                                observer.unobserve(entry.target);
                            }
                        });
                    },
                    { threshold: 0.1 },
                );
                document.querySelectorAll(".element-animation").forEach(function (el) {
                    observer.observe(el);
                });

                // ТАЙМЕР
                function updateCountdown() {
                    const endDate = new Date("December 12, 2026 18:00:00").getTime();
                    const now = Date.now();
                    const distance = endDate - now;

                    if (distance < 0) {
                        document.getElementById("days").textContent = "00";
                        document.getElementById("hours").textContent = "00";
                        document.getElementById("minutes").textContent = "00";
                        document.getElementById("seconds").textContent = "00";
                        return;
                    }

                    const days = Math.floor(distance / (1000 * 60 * 60 * 24));
                    const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                    const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                    const seconds = Math.floor((distance % (1000 * 60)) / 1000);

                    document.getElementById("days").textContent = String(days).padStart(2, "0");
                    document.getElementById("hours").textContent = String(hours).padStart(2, "0");
                    document.getElementById("minutes").textContent = String(minutes).padStart(2, "0");
                    document.getElementById("seconds").textContent = String(seconds).padStart(2, "0");
                }
                updateCountdown();
                setInterval(updateCountdown, 1000);
            });
        </script>

            // Мгновенный ответ гостю
            function showThanks() {
                statusEl.textContent = "Жауабыңызға рахмет!";
                statusEl.classList.add("show");
                clearTimeout(statusTimer);
                statusTimer = setTimeout(() => statusEl.classList.remove("show"), 5000);
            }

            // Отправка в таблицу в фоне (гость её не ждёт), до 3 попыток при сбое сети
            function sendInBackground(body, attempt = 1) {
                fetch(URL_APP, {
                    method: "POST",
                    headers: { "Content-Type": "application/x-www-form-urlencoded;charset=UTF-8" },
                    mode: "no-cors",
                    body: body,
                    keepalive: true, // запрос дойдёт, даже если гость закроет страницу
                }).catch(err => {
                    console.error("Error:", err);
                    if (attempt < 3) {
                        setTimeout(() => sendInBackground(body, attempt + 1), 2000 * attempt);
                    }
                });
            }

            form.addEventListener("submit", ev => {
                ev.preventDefault();

                const checked = form.querySelector("[name=name]:checked");
                const name = checked ? checked.value : "";
                const message = form.querySelector("[name=message]").value.trim();

                if (!name || !message) {
                    alert("Жауабыңызды таңдап, есіміңізді жазыңыз");
                    return;
                }

                const body = new URLSearchParams({ name, message }).toString();

                form.reset();
                showThanks();
                sendInBackground(body);
            });
        </script>

        <!-- ЛЕПЕСТКИ (sakura.js) -->
        <script>
            "use strict";
            var Sakura = function Sakura(selector, options) {
                var _this = this;
                if (typeof selector === "undefined") {
                    throw new Error("No selector present. Define an element.");
                }
                this.el = document.querySelector(selector);
                var defaults = {
                    className: "sakura",
                    fallSpeed: 1,
                    maxSize: 14,
                    minSize: 10,
                    delay: 300,
                    colors: [
                        {
                            gradientColorStart: "rgba(60, 90, 28, 0.85)",
                            gradientColorEnd: "rgba(111, 138, 83, 0.85)",
                            gradientColorDegree: 120,
                        },
                    ],
                };
                var extend = function extend(originalObj, newObj) {
                    Object.keys(originalObj).forEach(function (key) {
                        if (newObj && Object.prototype.hasOwnProperty.call(newObj, key)) {
                            originalObj[key] = newObj[key];
                        }
                    });
                    return originalObj;
                };
                this.settings = extend(defaults, options);
                this.el.style.overflowX = "hidden";

                function randomArrayElem(arr) {
                    return arr[Math.floor(Math.random() * arr.length)];
                }
                function randomInt(min, max) {
                    return Math.floor(Math.random() * (max - min + 1)) + min;
                }

                var prefixes = ["webkit", "moz", "MS", "o", ""];
                function PrefixedEvent(element, type, callback) {
                    for (var p = 0; p < prefixes.length; p += 1) {
                        var animType = type;
                        if (!prefixes[p]) {
                            animType = type.toLowerCase();
                        }
                        element.addEventListener(prefixes[p] + animType, callback, false);
                    }
                }

                function elementInViewport(el) {
                    var rect = el.getBoundingClientRect();
                    return (
                        rect.top >= 0 &&
                        rect.left >= 0 &&
                        rect.bottom <= (window.innerHeight || document.documentElement.clientHeight) &&
                        rect.right <= (window.innerWidth || document.documentElement.clientWidth)
                    );
                }

                this.createPetal = function () {
                    if (_this.el.dataset.sakuraAnimId) {
                        setTimeout(function () {
                            window.requestAnimationFrame(_this.createPetal);
                        }, _this.settings.delay);
                    }
                    var animationNames = {
                        blowAnimations: ["blow-soft-left", "blow-medium-left", "blow-soft-right", "blow-medium-right"],
                        swayAnimations: [
                            "sway-0",
                            "sway-1",
                            "sway-2",
                            "sway-3",
                            "sway-4",
                            "sway-5",
                            "sway-6",
                            "sway-7",
                            "sway-8",
                        ],
                    };
                    var blowAnimation = randomArrayElem(animationNames.blowAnimations);
                    var swayAnimation = randomArrayElem(animationNames.swayAnimations);
                    var fallTime =
                        (document.documentElement.clientHeight * 0.007 + Math.round(Math.random() * 5)) *
                        _this.settings.fallSpeed;
                    var animationsArr = [
                        "fall " + fallTime + "s linear 0s 1",
                        blowAnimation +
                            " " +
                            ((fallTime > 30 ? fallTime : 30) - 20 + randomInt(0, 20)) +
                            "s linear 0s infinite",
                        swayAnimation + " " + randomInt(2, 4) + "s linear 0s infinite",
                    ];
                    var animations = animationsArr.join(", ");

                    var petal = document.createElement("div");
                    petal.classList.add(_this.settings.className);
                    var height = randomInt(_this.settings.minSize, _this.settings.maxSize);
                    var width = height - Math.floor(randomInt(0, _this.settings.minSize) / 3);
                    var color = randomArrayElem(_this.settings.colors);
                    petal.style.background =
                        "linear-gradient(" +
                        color.gradientColorDegree +
                        "deg, " +
                        color.gradientColorStart +
                        ", " +
                        color.gradientColorEnd +
                        ")";
                    petal.style.webkitAnimation = animations;
                    petal.style.animation = animations;
                    petal.style.borderRadius =
                        randomInt(_this.settings.maxSize, _this.settings.maxSize + Math.floor(Math.random() * 10)) +
                        "px " +
                        randomInt(1, Math.floor(width / 4)) +
                        "px";
                    petal.style.height = height + "px";
                    petal.style.left = Math.random() * document.documentElement.clientWidth - 100 + "px";
                    petal.style.marginTop = -(Math.floor(Math.random() * 20) + 15) + "px";
                    petal.style.width = width + "px";

                    PrefixedEvent(petal, "AnimationEnd", function () {
                        if (!elementInViewport(petal)) {
                            petal.remove();
                        }
                    });
                    PrefixedEvent(petal, "AnimationIteration", function () {
                        if (!elementInViewport(petal)) {
                            petal.remove();
                        }
                    });

                    _this.el.appendChild(petal);
                };

                this.el.setAttribute("data-sakura-anim-id", window.requestAnimationFrame(this.createPetal));
            };

            document.addEventListener("DOMContentLoaded", function () {
                new Sakura("body", { delay: 50 });
            });
        </script>
    </body>
